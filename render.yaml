# Render Blueprint for the API. In the Render dashboard: New > Blueprint > select this repo.
# After the first deploy, set CLIENT_ORIGIN to your Vercel URL and run `npm run seed` from the Shell tab.
services:
  - type: web
    name: teammgmt-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
